services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin_dev_password}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_dev_password}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app_user:app_dev_password@postgres:5432/chatbot}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-postgresql+asyncpg://postgres:postgres_dev_password@postgres:5432/chatbot}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+asyncpg://app_user:app_dev_password@postgres:5432/chatbot_test}
      TEST_DATABASE_MIGRATION_URL: ${TEST_DATABASE_MIGRATION_URL:-postgresql+asyncpg://postgres:postgres_dev_password@postgres:5432/chatbot_test}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_dev_password}
      S3_BUCKET: ${S3_BUCKET:-knowledge-base}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge_m3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-claude-haiku-4-5-20251001}
      LLM_ESCALATION_MODEL: ${LLM_ESCALATION_MODEL:-claude-sonnet-4-5-20250929}
      LLM_ESCALATION_ENABLED: ${LLM_ESCALATION_ENABLED:-false}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: arq app.workers.settings.WorkerSettings
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_dev_password}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app_user:app_dev_password@postgres:5432/chatbot}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-postgresql+asyncpg://postgres:postgres_dev_password@postgres:5432/chatbot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_dev_password}
      S3_BUCKET: ${S3_BUCKET:-knowledge-base}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge_m3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-claude-haiku-4-5-20251001}
      LLM_ESCALATION_MODEL: ${LLM_ESCALATION_MODEL:-claude-sonnet-4-5-20250929}
      LLM_ESCALATION_ENABLED: ${LLM_ESCALATION_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
