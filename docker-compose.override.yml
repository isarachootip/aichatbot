# Automatically merged on local `docker compose up` (ignored by Coolify `-f docker-compose.yml`).
services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5439}:5432"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"

  minio:
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

  backend:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: ${APP_ENV:-development}

  worker:
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: ${APP_ENV:-development}

  dashboard:
    ports:
      - "${DASHBOARD_HOST_PORT:-3000}:3000"
