[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-ai-chat-agent-backend"
version = "0.1.0"
description = "Multi-tenant Thai AI Chat Agent SaaS backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "anthropic>=0.45.0",
    "arq>=0.26.1",
    "asyncpg>=0.30.0",
    "boto3>=1.36.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.6",
    "google-genai>=1.10.0",
    "httpx>=0.28.1",
    "openai>=1.60.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pgvector>=0.3.6",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.10.0",
    "pymupdf>=1.25.2",
    "pythainlp>=5.0.5",
    "python-crfsuite>=0.9.10",
    "python-docx>=1.1.2",
    "redis>=5.2.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.6",
]
local-embeddings = [
    "sentence-transformers>=3.3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["pymupdf.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "arq.*",
    "fitz.*",
    "docx.*",
    "pythainlp.*",
    "pandas.*",
    "boto3.*",
    "botocore.*",
    "google.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true
